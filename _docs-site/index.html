<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Analyse Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sidebar-w: 300px;
      --sidebar-bg: #1b1f2b;
      --sidebar-hover: #262b3a;
      --sidebar-active: #2d3348;
      --sidebar-text: #b4bcd0;
      --sidebar-text-bright: #e2e8f0;
      --accent: #6c8cff;
      --accent-dim: rgba(108,140,255,0.12);
      --content-bg: #ffffff;
      --content-text: #1e293b;
      --content-muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body { height: 100%; font-family: var(--font); background: var(--content-bg); color: var(--content-text); }

    /* ── Layout ──────────────────────────────── */
    .layout { display: flex; height: 100vh; }

    /* ── Sidebar ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--sidebar-bg); color: var(--sidebar-text);
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-header h1 {
      font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px;
    }
    .sidebar-header p {
      font-size: 11px; color: var(--content-muted); margin-top: 4px;
    }
    .sidebar-tree {
      flex: 1; overflow-y: auto; padding: 12px 0;
    }
    .sidebar-tree::-webkit-scrollbar { width: 5px; }
    .sidebar-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    /* Tree items */
    .tree-folder { margin-bottom: 2px; }
    .tree-folder-header {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 16px 7px 16px; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--sidebar-text-bright);
      transition: background 0.15s;
      user-select: none;
    }
    .tree-folder-header:hover { background: var(--sidebar-hover); }
    .tree-folder-header .chevron {
      font-size: 10px; transition: transform 0.2s; width: 14px; text-align: center;
      color: var(--sidebar-text); flex-shrink: 0;
    }
    .tree-folder-header .chevron.open { transform: rotate(90deg); }
    .tree-folder-header .folder-icon { font-size: 14px; flex-shrink: 0; }
    .tree-folder-header .folder-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tree-children { display: none; }
    .tree-children.open { display: block; }

    .tree-file {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px 6px 36px; cursor: pointer;
      font-size: 12.5px; color: var(--sidebar-text);
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .tree-file:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
    .tree-file.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
    .tree-file .file-icon { flex-shrink: 0; font-size: 13px; }
    .tree-file .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tree-empty {
      padding: 6px 16px 6px 36px; font-size: 11.5px;
      color: rgba(180,188,208,0.35); font-style: italic;
    }

    /* Indentation is set dynamically via inline styles */

    /* ── Content ─────────────────────────────── */
    .content { flex: 1; overflow-y: auto; }

    .content-inner {
      max-width: 820px; margin: 0 auto;
      padding: 40px 48px 80px;
    }

    /* Welcome state */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; text-align: center;
      color: var(--content-muted);
    }
    .welcome h2 { font-size: 22px; font-weight: 600; color: var(--content-text); margin-bottom: 8px; }
    .welcome p { font-size: 14px; line-height: 1.6; max-width: 400px; }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 12px; color: var(--content-muted); margin-bottom: 20px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .breadcrumb span { opacity: 0.5; }

    /* Rendered Markdown */
    .md-body { line-height: 1.7; font-size: 15px; }
    .md-body h1 { font-size: 28px; font-weight: 700; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .md-body h2 { font-size: 22px; font-weight: 600; margin: 32px 0 12px; }
    .md-body h3 { font-size: 18px; font-weight: 600; margin: 24px 0 8px; }
    .md-body h4 { font-size: 15px; font-weight: 600; margin: 20px 0 6px; }
    .md-body p { margin: 0 0 12px; }
    .md-body ul, .md-body ol { margin: 0 0 12px; padding-left: 24px; }
    .md-body li { margin-bottom: 4px; }
    .md-body a { color: var(--accent); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body strong { font-weight: 600; }
    .md-body blockquote {
      border-left: 3px solid var(--accent); margin: 16px 0;
      padding: 8px 16px; background: var(--accent-dim); border-radius: 0 6px 6px 0;
      color: var(--content-muted);
    }
    .md-body code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px; background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    }
    .md-body pre {
      background: #0f172a; color: #e2e8f0; padding: 16px 20px;
      border-radius: 8px; overflow-x: auto; margin: 16px 0;
      font-size: 13px; line-height: 1.5;
    }
    .md-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .md-body table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
    .md-body th, .md-body td {
      border: 1px solid var(--border); padding: 8px 12px; text-align: left;
    }
    .md-body th { background: var(--code-bg); font-weight: 600; }
    .md-body tr:hover td { background: rgba(108,140,255,0.04); }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .md-body img { max-width: 100%; border-radius: 6px; }

    /* Loading spinner */
    .loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 40vh; color: var(--content-muted);
    }
    .spinner {
      width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-header">
      <h1>BP Analyse Wiki</h1>
      <p>Gruppenarbeit Unternehmensanalyse</p>
    </div>
    <div class="sidebar-tree" id="tree"></div>
  </nav>

  <main class="content" id="content">
    <div class="content-inner">
      <div class="welcome">
        <h2>BP Analyse Wiki</h2>
        <p>Klicke links auf eine Datei, um den Inhalt hier anzuzeigen.</p>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  const treeEl = document.getElementById('tree');
  const contentEl = document.getElementById('content');
  let activeFileEl = null;

  // ── Fetch folder tree ──────────────────────
  async function loadTree() {
    try {
      const res = await fetch('/api/tree');
      const tree = await res.json();
      treeEl.innerHTML = '';
      renderTree(tree, treeEl, 0, true);
    } catch (e) {
      treeEl.innerHTML = '<div style="padding:16px;color:#f87171;">Fehler beim Laden des Verzeichnisbaums.</div>';
    }
  }

  // ── Render tree recursively ────────────────
  const BASE_PAD = 16;   // px left padding at depth 0
  const PAD_STEP = 16;   // extra px per nesting level
  const FILE_EXTRA = 20; // extra indent for files inside a folder

  function renderTree(items, parent, depth, autoOpen) {
    const folders = items.filter(i => i.type === 'folder');
    const files = items.filter(i => i.type === 'file');
    const folderPad = BASE_PAD + depth * PAD_STEP;
    const filePad   = folderPad + FILE_EXTRA;

    folders.forEach(item => {
      const div = document.createElement('div');
      div.className = 'tree-folder';

      const header = document.createElement('div');
      header.className = 'tree-folder-header';
      header.style.paddingLeft = folderPad + 'px';

      const chevron = document.createElement('span');
      chevron.className = 'chevron' + (autoOpen ? ' open' : '');
      chevron.textContent = '\u25B6';

      const icon = document.createElement('span');
      icon.className = 'folder-icon';
      icon.textContent = '\uD83D\uDCC1';

      const name = document.createElement('span');
      name.className = 'folder-name';
      name.textContent = formatName(item.name);

      header.append(chevron, icon, name);

      const children = document.createElement('div');
      children.className = 'tree-children' + (autoOpen ? ' open' : '');

      if (item.children && item.children.length > 0) {
        renderTree(item.children, children, depth + 1, false);
      } else {
        const empty = document.createElement('div');
        empty.className = 'tree-empty';
        empty.style.paddingLeft = filePad + 'px';
        empty.textContent = 'noch keine Inhalte';
        children.appendChild(empty);
      }

      header.addEventListener('click', () => {
        chevron.classList.toggle('open');
        children.classList.toggle('open');
      });

      div.append(header, children);
      parent.appendChild(div);
    });

    files.forEach(item => {
      const a = document.createElement('div');
      a.className = 'tree-file';
      a.style.paddingLeft = (depth === 0 ? BASE_PAD : filePad) + 'px';

      const icon = document.createElement('span');
      icon.className = 'file-icon';
      icon.textContent = '\uD83D\uDCC4';

      const name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = formatName(item.name.replace(/\.md$/i, ''));

      a.append(icon, name);
      a.addEventListener('click', () => loadFile(item.path, a));
      parent.appendChild(a);
    });
  }

  // ── Format display name ────────────────────
  function formatName(raw) {
    // Remove leading number prefix like "01-" or "01_"
    return raw.replace(/^\d+[-_]\s*/, '');
  }

  // ── Load and render a file ─────────────────
  async function loadFile(path, el) {
    if (activeFileEl) activeFileEl.classList.remove('active');
    el.classList.add('active');
    activeFileEl = el;

    contentEl.innerHTML = '<div class="content-inner"><div class="loading"><div class="spinner"></div>Laden...</div></div>';

    try {
      // Encode each path segment separately so slashes survive
      const safePath = path.split('/').map(s => encodeURIComponent(s)).join('/');
      const res = await fetch('/api/content/' + safePath);
      if (!res.ok) throw new Error('not found');
      const md = await res.text();

      const breadcrumb = path.split('/').map(p => formatName(p.replace(/\.md$/i, '')));

      contentEl.innerHTML = '<div class="content-inner">'
        + '<div class="breadcrumb">' + breadcrumb.map((b,i) =>
            (i < breadcrumb.length - 1 ? '<span>' + b + '</span><span>/</span>' : '<strong>' + b + '</strong>')
          ).join('') + '</div>'
        + '<div class="md-body">' + marked.parse(md) + '</div>'
        + '</div>';

      contentEl.scrollTop = 0;
    } catch (e) {
      contentEl.innerHTML = '<div class="content-inner"><div class="welcome"><h2>Datei nicht gefunden</h2><p>' + path + '</p></div></div>';
    }
  }

  // ── Init ───────────────────────────────────
  loadTree();
})();
</script>

</body>
</html>
